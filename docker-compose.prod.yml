# Syntaxe: docker-compose.prod.yml
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Active Cookie Secure et HSTS via nginx (TLS terminé en amont ou ajout certs).

services:
  api:
    environment:
      COOKIE_SECURE: "true"

  # Le port d'écoute vient de docker-compose.yml (HTTP_PORT, défaut 3080). Ne pas ajouter "80:80" ici : les ports des
  # fichiers Compose s'additionnent, et le 80 est déjà pris par un autre nginx sur cet hôte.
