worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 15m;

  # Rate limit pour l'auth
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
  # Dépassement de débit : 429 + JSON (et non un 503 HTML), que l'app sait afficher.
  limit_req_status 429;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  upstream api_upstream {
    server api:3000;
  }

  server {
    listen 80 default_server;
    server_name _;

    error_page 429 @rate_limited;
    location @rate_limited {
      default_type application/json;
      return 429 '{"error":"Trop de requêtes. Réessaie dans une minute."}';
    }

    # Le backoffice n'est jamais joignable depuis l'hôte public de l'app.
    location ^~ /api/admin { return 404; }

    # Security headers
    include /etc/nginx/security-headers.conf;

    location = /healthz {
      access_log off;
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    location /api/auth/ {
      limit_req zone=auth_limit burst=20 nodelay;
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Cookie $http_cookie;
    }

    location = /api/me/events {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 90s;
      gzip off;
    }

    location = /api/ai/chat {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 90s;
      gzip off;
    }

    location /api/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Cookie $http_cookie;
      proxy_read_timeout 120s;
    }

    location = /sw.js {
      root /usr/share/nginx/html;
      add_header Cache-Control "no-cache";
      include /etc/nginx/security-headers.conf;
    }

    location ~* "\.[0-9a-f]{8}\.(js|css)$" {
      root /usr/share/nginx/html;
      add_header Cache-Control "public, max-age=31536000, immutable";
      include /etc/nginx/security-headers.conf;
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
      include /etc/nginx/security-headers.conf;
    }
  }

  # Backoffice (React-Admin) : hôte dédié, cookie admin_session isolé (path=/api/admin, SameSite=strict).
  server {
    listen 80;
    server_name vetbook-admin.boss-etech.net;

    error_page 429 @rate_limited;
    location @rate_limited {
      default_type application/json;
      return 429 '{"error":"Trop de requêtes. Réessaie dans une minute."}';
    }

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    location = /healthz {
      access_log off;
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    location = /api/admin/auth/login {
      limit_req zone=auth_limit burst=5 nodelay;
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Cookie $http_cookie;
    }

    location /api/admin/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Cookie $http_cookie;
      proxy_read_timeout 120s;
    }

    location /api/ { return 404; }

    location /assets/ {
      root /usr/share/nginx/admin;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
      root /usr/share/nginx/admin;
      try_files $uri /index.html;
      add_header Cache-Control "no-cache";
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    }
  }
}
