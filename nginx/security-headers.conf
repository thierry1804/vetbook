# En-têtes de sécurité du site public. À inclure dans CHAQUE bloc qui déclare son propre add_header :
# nginx n'hérite pas des add_header d'un niveau supérieur dès qu'un niveau inférieur en déclare un
# (c'est ce qui faisait disparaître la CSP des pages HTML).
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; img-src 'self' data: blob: https:; connect-src 'self' https://accounts.google.com https://overpass-api.de; frame-src https://accounts.google.com; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self' https://acymadagascar.org; frame-ancestors 'none';" always;
